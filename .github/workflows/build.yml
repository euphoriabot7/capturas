name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile capturas.py

      - name: Version
        run: python capturas.py --version

  build:
    name: Compilar (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Capturas-windows
          - os: macos-latest
            artifact: Capturas-macos
          - os: ubuntu-latest
            artifact: Capturas-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: python -m pip install pillow pyinstaller

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Capturas --icon icon.ico
          --add-data "icon.ico;." --add-data "icon.png;."
          capturas.py

      - name: Compilar (macOS / Linux)
        if: runner.os != 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Capturas
          --add-data "icon.ico:." --add-data "icon.png:."
          capturas.py

      - name: Nombre del binario (macOS)
        if: runner.os == 'macOS'
        run: mv dist/Capturas dist/Capturas-macos

      - name: Nombre del binario (Linux)
        if: runner.os == 'Linux'
        run: mv dist/Capturas dist/Capturas-linux

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
